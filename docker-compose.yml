services:
  postgres:
    image: postgres:16-alpine
    container_name: cesarx-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cesarx_analytics
      POSTGRES_USER: cesarx
      POSTGRES_PASSWORD: cesarx
    ports:
      - "5432:5432"
    volumes:
      - cesarx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cesarx -d cesarx_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cesarx_pgdata:
