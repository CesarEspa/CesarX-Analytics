server:
  port: ${PORT:8080}

spring:
  application:
    name: analytics-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cesarx_analytics}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:cesarx}
    password: ${DB_PASSWORD:cesarx}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: ${DB_SCHEMA:public}
      maximum-pool-size: ${DB_POOL_SIZE:3}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:public}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}

app:
  jwt:
    # Sin JWT_SECRET se genera una clave aleatoria al arrancar (las sesiones no sobreviven a un reinicio).
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  market-data:
    yahoo-finance-base-url: https://query1.finance.yahoo.com
    cache-ttl-ms: ${MARKET_CACHE_TTL_MS:30000}

  # Base URL of the Python AI microservice (wired up in Phase 2)
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

  alerts:
    check-interval-ms: ${ALERTS_CHECK_INTERVAL_MS:300000} # 5 min

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://cesarespa.github.io,http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
    probes:
      enabled: false

logging:
  level:
    com.cesarx.analytics: INFO
    org.springframework.security: WARN
